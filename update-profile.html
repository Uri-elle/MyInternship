<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Mettre à jour le profil - MyInternship</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div style="padding: 0 2rem; margin-bottom: 2rem;"><strong>MyInternship</strong></div>
            <nav class="sidebar-nav">
                <a href="student-profile.html">Profil</a>
                <a href="#">Candidatures</a>
            </nav>
        </aside>
        <main class="main-content">
            <h2>Mise à jour des informations du profil</h2>
            <div class="form-container" style="margin: 0; max-width: 100%;">
                <form action="student-profile.html">
                    <div class="form-group"><label>Nom</label><input type="text" value="Montana"></div>
                    <div class="form-group"><label>Prénom</label><input type="text" value="Ana"></div>
                    <div class="form-group"><label>Email</label><input type="email" value="anamontana@yahoo.fr"></div>
                    <div class="form-group"><label>Formation/Ecole</label><input type="text"
                            value="Université de l'académie"></div>
                    <div class="form-group"><label>Compétences (séparées par des virgules)</label><input type="text"
                            value="Angular, HTML/CSS, Bootstrap"></div>
                    <button type="submit" class="btn btn-success">Confirmer les modifications</button>
                </form>
            </div>
        </main>
    </div>
</body>

</html>
