
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - MyInternship</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #f0f2f5;">
    <div class="form-container" style="width: 100%; max-width: 400px;">
        <h2 style="text-align: center;">Connectez-vous</h2>
        <form>
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="votre@email.com">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Se connecter</button>
            <p style="text-align: center; margin-top: 1rem;">Ou</p>
            <a href="user-type.html" class="btn btn-outline" style="width: 100%; color: var(--primary-color); border-color: var(--primary-color); text-align: center;">Créer votre compte</a>
        </form>
    </div>
</body>
</html>
