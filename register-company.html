<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Inscription Entreprise - MyInternship</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="form-container">
        <h2>Inscription Entreprise</h2>
        <form id="registerCompanyForm">
            <div class="form-group">
                <label>Nom de l'entreprise</label>
                <input type="text" id="nom_entreprise" required>
            </div>
            <div class="form-group">
                <label>Secteur d'activité</label>
                <input type="text" id="secteur" required>
            </div>
            <div class="form-group">
                <label>Numéro SIRET (14 chiffres)</label>
                <input type="text" id="siret" maxlength="14" required>
            </div>
            <div class="form-group">
                <label>Adresse postale</label>
                <input type="text" id="adresse" required>
            </div>
            <div class="form-group">
                <label>Email professionnel</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="mdp" required>
            </div>
            <div class="form-group">
                <label>Confirmer le mot de passe</label>
                <input type="password" id="mdp_confirm" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">S'inscrire</button>
        </form>
    </div>

    <script>
        document.getElementById('registerCompanyForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Empêche le rechargement de la page

            // 1. Récupération des valeurs du formulaire
            const nom_entreprise = document.getElementById('nom_entreprise').value;
            const secteur = document.getElementById('secteur').value;
            const siret = document.getElementById('siret').value;
            const adresse = document.getElementById('adresse').value;
            const email = document.getElementById('email').value;
            const mdp = document.getElementById('mdp').value;
            const mdp_confirm = document.getElementById('mdp_confirm').value;

            // 2. Vérification de sécurité locale pour les mots de passe
            if (mdp !== mdp_confirm) {
                alert("Erreur : Les deux mots de passe ne correspondent pas.");
                return;
            }

            if (siret.length !== 14) {
                alert("Erreur : Le numéro SIRET doit faire exactement 14 chiffres.");
                return;
            }

            // 3. Envoi des données en JSON au serveur Node.js (route /api/register-company)
            try {
                const response = await fetch('/api/register-company', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, mdp, nom_entreprise, adresse, secteur, siret })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.message); // Affiche "Compte entreprise créé avec succès !"
                    window.location.href = 'login.html'; // Redirige vers la page de connexion
                } else {
                    alert('Erreur du serveur : ' + data.error);
                }
            } catch (error) {
                console.error("Erreur réseau :", error);
                alert("Impossible de joindre le serveur. Vérifiez que node server.js est bien lancé.");
            }
        });
    </script>
</body>

</html>
