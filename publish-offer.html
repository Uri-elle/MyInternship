
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Publier une offre - MyInternship</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="#">Tableau de bord</a>
                <a href="company-offers.html" class="active">Offres</a>
                <a href="received-applications.html">Candidatures</a>
                <a href="#">Profil</a>
            </nav>
        </aside>
        <main class="main-content">
            <h2>Publier une nouvelle offre</h2>
            <div class="form-container" style="margin: 0; max-width: 100%;">
                <form action="company-offers.html">
                    <div class="form-group"><label>Titre du poste</label><input type="text" placeholder="ex: Développeur Front-End"></div>
                    <div class="form-group"><label>Description des missions</label><textarea rows="5"></textarea></div>
                    <div class="form-group"><label>Compétences attendues</label><input type="text" placeholder="HTML, CSS, React..."></div>
                    <button type="submit" class="btn btn-success">Mettre en ligne l'offre</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
