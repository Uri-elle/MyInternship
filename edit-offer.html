
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier l'offre - MyInternship</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="company-offers.html">Annuler</a>
            </nav>
        </aside>
        <main class="main-content">
            <h2>Modifier l'offre de stage</h2>
            <div class="form-container" style="margin: 0; max-width: 100%;">
                <form action="company-offers.html">
                    <div class="form-group"><label>Titre du poste</label><input type="text" value="Fullstack Dev H/F"></div>
                    <div class="form-group"><label>Description des missions</label><textarea rows="6">Profil capable de concevoir des applications web complexes...</textarea></div>
                    <div class="form-group"><label>Compétences requises</label><input type="text" value="React, Node.js, PostgreSQL"></div>
                    <button type="submit" class="btn btn-success">Mettre à jour l'offre</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
