<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Inscription Étudiant - MyInternship</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="form-container">
        <h2>Inscription Étudiant</h2>
        <form id="registerStudentForm">
            <div class="form-group">
                <label>Nom</label>
                <input type="text" id="nom" required>
            </div>
            <div class="form-group">
                <label>Prénom</label>
                <input type="text" id="prenom" required>
            </div>
            <div class="form-group">
                <label>Formation / École</label>
                <input type="text" id="formation" placeholder="Ex: BTS SIO SLAM" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="mdp" required>
            </div>
            <div class="form-group">
                <label>Confirmer le mot de passe</label>
                <input type="password" id="mdp_confirm" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">S'inscrire</button>
        </form>
    </div>

    <script>
        document.getElementById('registerStudentForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Empêche le rechargement de la page

            // 1. Récupération des valeurs saisies par l'étudiant
            const nom = document.getElementById('nom').value;
            const prenom = document.getElementById('prenom').value;
            const formation = document.getElementById('formation').value;
            const email = document.getElementById('email').value;
            const mdp = document.getElementById('mdp').value;
            const mdp_confirm = document.getElementById('mdp_confirm').value;

            // 2. Vérification de sécurité 
            if (mdp !== mdp_confirm) {
                alert("Erreur : Les deux mots de passe ne correspondent pas.");
                return;
            }

            // 3. Envoi des données en JSON au serveur Node.js
            try {
                const response = await fetch('/api/register-student', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, mdp, nom, prenom, formation })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.message); // "Compte étudiant créé avec succès !"
                    window.location.href = 'login.html'; // Redirection vers la page de connexion
                } else {
                    alert('Erreur : ' + data.error);
                }
            } catch (error) {
                console.error("Erreur réseau :", error);
                alert("Impossible de joindre le serveur. Vérifiez que votre terminal affiche bien que le serveur est lancé.");
            }
        });
    </script>
</body>

</html>
