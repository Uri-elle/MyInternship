
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Confirmation de Suppression Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #f8f9fa;">
    <div class="card" style="max-width: 550px; border-top: 6px solid #e74c3c; padding: 2.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
        <h2 style="color: #e74c3c; margin-top: 0;">Révocation / Suppression d'offre</h2>
        <p>Vous êtes sur le point de supprimer définitivement une offre de stage en tant qu'<strong>Administrateur</strong>.</p>
        <p style="background: #fdf2f2; padding: 1rem; border-left: 4px solid #e74c3c; color: #9b2c2c;">
            Cette action retirera l'offre de l'index public immédiatement et notifiera l'entreprise dépositaire du motif de la suppression.
        </p>
        
        <form action="admin-offers.html" style="margin-top: 2rem;">
            <div class="form-group">
                <label style="font-weight: bold;">Motif de la suppression (envoyé à l'entreprise) :</label>
                <select style="width: 100%; padding: 0.5rem; margin-top: 0.5rem;">
                    <option>Contenu inapproprié / Non conforme à la charte</option>
                    <option>Offre frauduleuse / Suspectée d'arnaque</option>
                    <option>Doublon ou erreur de publication</option>
                    <option>Autre motif (spécifié ci-dessous)</option>
                </select>
            </div>
            <div class="form-group">
                <textarea placeholder="Commentaire additionnel facultatif..." rows="3" style="width: 100%; padding: 0.5rem;"></textarea>
            </div>
            <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                <a href="admin-offers.html" class="btn" style="background: #95a5a6; color: white;">Annuler</a>
                <button type="submit" class="btn btn-danger">Confirmer la suppression forcée</button>
            </div>
        </form>
    </div>
</body>
</html>
